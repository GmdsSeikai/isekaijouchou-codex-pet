[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-dango-pet-builder"
version = "2.1.1"
description = "Reproducible builder and validator for the Nemo Dango Codex pet"
requires-python = ">=3.11,<3.14"
dependencies = [
  "Pillow==12.3.0",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.codex-pet]
qa-evidence-index = "qa/evidence-index.json"
qa-summary = "qa/releases/v2.1.1/QA-SUMMARY.md"

[tool.setuptools]
packages = ["nemo_pet_builder", "codex_pet_builder"]
